<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麦麦角色卡</title>
<style>
  :root{
    --ink:#1b1b1d;--ink2:#4a4a50;--ink3:#8a8a92;--line:#e6e6e9;--grid:#f4f4f6;--bg:#fbfbfc;
    --brand:#ffc72c;--radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 100%,
      var(--bg);
    color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{background:#17171a;color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(0,0,0,.4)}
  .bar{max-width:1180px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;font-weight:800;color:#17171a;font-size:15px;flex:none}
  .bar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.5px}
  .bar .sub{font-size:12px;color:#9a9aa2;margin-left:2px}
  .grow{flex:1}
  .btn{border:1px solid #3a3a40;background:#222226;color:#e8e8ec;border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
  .btn:hover{background:#2d2d33;border-color:#4a4a52}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#17171a;font-weight:700}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.5;cursor:default}

  main{max-width:1180px;margin:0 auto;padding:24px 20px 72px;display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}
  @media (max-width:900px){main{grid-template-columns:1fr}}

  .stage{display:flex;flex-direction:column;align-items:center;gap:16px}
  .canvas-wrap{
    position:relative;width:min(470px,100%);border-radius:18px;
    filter:drop-shadow(0 24px 48px rgba(16,16,20,.16));
  }
  canvas{display:block;width:100%;height:auto;border-radius:16px}
  .hint{font-size:12px;color:var(--ink3);text-align:center;line-height:1.7}

  .panel{position:sticky;top:78px;display:flex;flex-direction:column;gap:18px}
  @media (max-width:900px){.panel{position:static;order:2}}
  .box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:0 1px 2px rgba(16,16,20,.04)}
  .box h2{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--ink3);text-transform:uppercase}
  .tabs{display:flex;flex-direction:column;gap:6px}
  .tab{
    display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;
    border-radius:9px;padding:9px 11px;cursor:pointer;text-align:left;font-size:13px;color:var(--ink2);
  }
  .tab:hover{border-color:#cfcfd6;background:#fafafb}
  .tab.on{border-color:#17171a;background:#17171a;color:#fff}
  .tab .n{font-weight:700;font-size:13px}
  .tab .e{font-size:10px;letter-spacing:.8px;opacity:.6;margin-left:auto}
  .swatches{display:flex;flex-wrap:wrap;gap:10px}
  .sw{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border:0;background:none;padding:0;font-size:11px;color:var(--ink3)}
  .sw i{width:40px;height:40px;border-radius:11px;border:2px solid transparent;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .sw.on i{border-color:#17171a}
  .sw.on{color:var(--ink)}
  .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
  select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .note{font-size:12px;color:var(--ink3);line-height:1.7;margin-top:10px}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--ink2)}
  .legend div{display:flex;align-items:center;gap:8px}
  .legend i{width:12px;height:12px;border-radius:4px;display:block;flex:none;box-shadow:0 0 8px currentColor}
  .badge-preview{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#fff3e8;color:#a1470a;margin-left:8px}

  /* 直出模式：?bare=1&card=stats&theme=midnight —— 只留卡面，方便无头浏览器截图 */
  body.bare header,body.bare .panel,body.bare .hint{display:none}
  body.bare main{display:block;max-width:none;padding:0}
  body.bare .stage{gap:0}
  body.bare .canvas-wrap{width:1080px;filter:none;border-radius:0}
  body.bare canvas{border-radius:0}
  body.bare{background:#fff}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo">M</div>
    <div>
      <h1>麦麦角色卡<span class="badge-preview" id="previewTag" hidden>品质预览</span></h1>
      <div class="sub" id="metaLine">加载中…</div>
    </div>
    <div class="grow"></div>
    <a class="btn" href="preview.html" id="backLink">← 返回体检报告</a>
    <button class="btn" id="btnCopy">复制图片</button>
    <button class="btn primary" id="btnSave">保存图片</button>
  </div>
</header>

<main>
  <section class="stage">
    <div class="canvas-wrap"><canvas id="card" width="2160" height="3024" role="img" aria-label="麦麦角色卡"></canvas></div>
    <div class="hint">
      1080 × 1512 · 导出 2160 × 3024 PNG（2 倍图）<br>
      手机端长按卡面同样可保存。
    </div>
  </section>

  <aside class="panel">
    <div class="box">
      <h2>卡面</h2>
      <div class="tabs" id="tabs"></div>
    </div>

    <div class="box">
      <h2>主题</h2>
      <div class="swatches" id="swatches"></div>
      <div class="note">主题随画像自动匹配，也可手动切换；稀有度光晕独立于主题。</div>
    </div>

    <div class="box">
      <h2>稀有度</h2>
      <div class="row">
        <select id="rarityPick"></select>
      </div>
      <div class="legend" id="legend" style="margin-top:12px"></div>
    </div>

    <div class="box">
      <h2>数据</h2>
      <div class="note" id="dataNote" style="margin-top:0"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="btnLoad" style="background:#fff;color:var(--ink);border-color:var(--line)">载入 card.json</button>
        <input type="file" id="fileInput" accept=".json,application/json" hidden>
      </div>
    </div>
  </aside>
</main>

    var list = DATA.themes || [], p = persona();
    var key = state.theme || DATA.defaultTheme || p.style || "classic";
    for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
    return list[0];
  }
  function rarity() {
    var base = persona().rarity || { key: "blue", name: "蓝色品质", tier: "普通", stars: 1, color: "#3B82F6", glow: "#93C5FD" };
    if (state.rarity === "auto") return base;
    var lad = DATA.ladder || [];
    for (var i = 0; i < lad.length; i++) if (lad[i].key === state.rarity) return lad[i];
    return base;
  }
  function cardByName(type) {
    var list = DATA.cards || [];
    for (var i = 0; i < list.length; i++) if (list[i].type === type) return list[i];
    return list[0];
  }
  function isDark(t) { return lum(t.ink) > 0.5; }
  function warnColor(t) { return isDark(t) ? "#FF9E64" : "#E8590C"; }
  function goodColor(t) { return isDark(t) ? "#5CE1A6" : "#1F9D55"; }

  /* ------------------------------------------------------------------ 背景与光晕 */

  function paintBackground(t, rar) {
    var g = ctx.createLinearGradient(0, 0, W * 0.35, H);
    g.addColorStop(0, t.bg1);
    g.addColorStop(1, t.bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 品质光晕：卡片外围的径向光
    var strength = 0.30 + (rar.stars - 1) * 0.10;
    var halo = ctx.createRadialGradient(W / 2, H * 0.40, 90, W / 2, H * 0.40, 880);
    halo.addColorStop(0, rgba(rar.glow, strength * 0.55));
    halo.addColorStop(0.42, rgba(rar.color, strength * 0.34));
    halo.addColorStop(1, rgba(rar.color, 0));
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);

    paintPattern(t, rar);
  }

  function paintPattern(t, rar) {
    var dark = isDark(t);
    var rnd = mulberry32(persona().seed || 7);
    var i, x, y;

    if (t.pattern === "seeds") {
      ctx.save();
      for (i = 0; i < 90; i++) {
        x = rnd() * W; y = rnd() * H;
        if (x > PAD - 20 && x < W - PAD + 20 && y > PAD - 20 && y < H - PAD + 20) continue;
        ctx.beginPath();
        ctx.ellipse(x, y, 5.5, 3.4, rnd() * Math.PI, 0, Math.PI * 2);
        ctx.fillStyle = rgba(t.ink, 0.10);
        ctx.fill();
      }
      ctx.restore();
    } else if (t.pattern === "stars") {
      ctx.save();
      for (i = 0; i < 150; i++) {
        x = rnd() * W; y = rnd() * H;
        var a = 0.10 + rnd() * 0.45;
        ctx.beginPath();
        ctx.arc(x, y, rnd() * 1.8 + 0.5, 0, Math.PI * 2);
        ctx.fillStyle = rgba(t.accent2, a);
        ctx.fill();
      }
      for (i = 0; i < 7; i++) {
        x = rnd() * W; y = rnd() * H * 0.9;
        ctx.strokeStyle = rgba(t.accent2, 0.5);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y);
        ctx.moveTo(x, y - 9); ctx.lineTo(x, y + 9); ctx.stroke();
      }
      ctx.restore();
    } else if (t.pattern === "rule") {
      ctx.save();
      ctx.strokeStyle = rgba(t.ink, 0.055);
      ctx.lineWidth = 1.5;
      for (y = 210; y < H; y += 36) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      // 顶部两条胶带
      ctx.fillStyle = rgba(t.accent, 0.10);
      ctx.save(); ctx.translate(150, 64); ctx.rotate(-0.18); ctx.fillRect(-80, -22, 160, 44); ctx.restore();
      ctx.save(); ctx.translate(W - 150, 64); ctx.rotate(0.18); ctx.fillRect(-80, -22, 160, 44); ctx.restore();
      ctx.restore();
    } else if (t.pattern === "grid") {
      ctx.save();
      ctx.strokeStyle = rgba(t.accent2, 0.07);
      ctx.lineWidth = 1.4;
      for (x = 0; x < W; x += 54) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (y = 0; y < H; y += 54) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      var gl = ctx.createLinearGradient(0, 0, 0, H);
      gl.addColorStop(0, rgba(t.accent, 0.10));
      gl.addColorStop(0.5, rgba(t.accent, 0));
      gl.addColorStop(1, rgba(t.accent2, 0.08));
      ctx.fillStyle = gl;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    } else if (t.pattern === "foil") {
      ctx.save();
      ctx.globalAlpha = 0.5;
      for (i = 0; i < 8; i++) {
        x = -300 + i * 190 + rnd() * 60;
        var grad = ctx.createLinearGradient(x, 0, x + 420, H);
        grad.addColorStop(0, rgba(t.accent2, 0));
        grad.addColorStop(0.45, rgba(t.accent2, 0.05 + rnd() * 0.05));
        grad.addColorStop(0.55, rgba(t.accent2, 0));
        grad.addColorStop(1, rgba(t.accent2, 0));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x + 260, 0); ctx.lineTo(x + 120, H); ctx.lineTo(x - 140, H);
        ctx.closePath(); ctx.fill();
      }
      for (i = 0; i < 70; i++) {
        x = rnd() * W; y = rnd() * H;
        ctx.beginPath();
        ctx.arc(x, y, rnd() * 1.6 + 0.4, 0, Math.PI * 2);
        ctx.fillStyle = rgba(t.accent2, 0.10 + rnd() * 0.22);
        ctx.fill();
      }
      ctx.restore();
    }
    if (dark) {
      var vg = ctx.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 980);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0,0.42)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function paintSurface(t, rar) {
    var sg = ctx.createLinearGradient(0, PAD, 0, PAD + CH);
    sg.addColorStop(0, t.surface);
    sg.addColorStop(1, t.surface2);
    fillR(PAD, PAD, CW, CH, RAD, sg);

    // 内描边
    strokeR(PAD + 1, PAD + 1, CW - 2, CH - 2, RAD - 1, t.line, 2);

    // 稀有度光晕边框：多层 shadowBlur 叠加
    ctx.save();
    for (var i = 0; i < 3; i++) {
      ctx.shadowColor = rgba(rar.color, 0.85);
      ctx.shadowBlur = 24 + rar.stars * 11 + i * 20;
      ctx.strokeStyle = rgba(rar.glow, 0.85 - i * 0.24);
      ctx.lineWidth = 8 - i * 2.4;
      strokeR(PAD, PAD, CW, CH, RAD, ctx.strokeStyle, ctx.lineWidth);
    }
    ctx.restore();

    // 清晰一圈主色边
    strokeR(PAD + 1, PAD + 1, CW - 2, CH - 2, RAD - 1, rgba(rar.color, 0.9), 2.4);

    // 高稀有度：四角光楔
    if (rar.stars >= 4) {
      ctx.save();
      ctx.globalAlpha = 0.75;
      var corners = [[PAD, PAD, 1, 1], [W - PAD, PAD, -1, 1], [PAD, H - PAD, 1, -1], [W - PAD, H - PAD, -1, -1]];
      corners.forEach(function (c) {
        var g = ctx.createLinearGradient(c[0], c[1], c[0] + 120 * c[2], c[1] + 120 * c[3]);
        g.addColorStop(0, rgba(rar.glow, 0.55));
        g.addColorStop(1, rgba(rar.glow, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(c[0], c[1] + 96 * c[3]);
        ctx.lineTo(c[0], c[1]);
        ctx.lineTo(c[0] + 96 * c[2], c[1]);
        ctx.quadraticCurveTo(c[0] + 18 * c[2], c[1] + 18 * c[3], c[0], c[1] + 96 * c[3]);
        ctx.closePath();
        ctx.fill();
      });
      ctx.restore();
    }

    // 高稀有度：边框外侧星屑
    if (rar.stars >= 3) {
      var rnd = mulberry32((persona().seed || 3) + rar.stars * 97);
      ctx.save();
      for (var k = 0; k < 14 + rar.stars * 4; k++) {
        var edge = Math.floor(rnd() * 4);
        var px, py;
        if (edge === 0) { px = PAD + rnd() * CW; py = PAD - 10 - rnd() * 8; }
        else if (edge === 1) { px = PAD + rnd() * CW; py = H - PAD + 10 + rnd() * 8; }
        else if (edge === 2) { px = PAD - 10 - rnd() * 8; py = PAD + rnd() * CH; }
        else { px = W - PAD + 10 + rnd() * 8; py = PAD + rnd() * CH; }
        star(px, py, 2 + rnd() * 5, rgba(rar.glow, 0.35 + rnd() * 0.45));
      }
      ctx.restore();
    }

    // 金/红：斜向高光带
    if (rar.stars >= 4) {
      ctx.save();
      rrect(PAD, PAD, CW, CH, RAD); ctx.clip();
      var sh = ctx.createLinearGradient(PAD, PAD, PAD + 520, PAD + 900);
      sh.addColorStop(0, rgba(rar.glow, 0));
      sh.addColorStop(0.5, rgba(rar.glow, 0.07));
      sh.addColorStop(1, rgba(rar.glow, 0));
      ctx.fillStyle = sh;
      ctx.fillRect(PAD, PAD, CW, CH);
      ctx.restore();
    }
  }

  function star(x, y, r, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.quadraticCurveTo(x + r * 0.18, y - r * 0.18, x + r, y);
    ctx.quadraticCurveTo(x + r * 0.18, y + r * 0.18, x, y + r);
    ctx.quadraticCurveTo(x - r * 0.18, y + r * 0.18, x - r, y);
    ctx.quadraticCurveTo(x - r * 0.18, y - r * 0.18, x, y - r);
    ctx.fill();
    ctx.restore();
  }

  /* ------------------------------------------------------------------ 角色绘制 */

  function drawHead(R, look, t) {
    var hair = look.hair, hc = look.hairColor, skin = look.skin;
    var acc = look.accessory, expr = look.expression;
    var line = mix(hc, "#000000", 0.45);
    var top = -R * 1.72;

    // 后发
    ctx.save();
    ctx.fillStyle = hc;
    if (hair === "bob") {
      ctx.beginPath(); ctx.ellipse(0, 16, R * 1.05, R * 1.10, 0, 0, Math.PI * 2); ctx.fill();
    } else if (hair === "twin") {
      [-1, 1].forEach(function (s) {
        ctx.beginPath(); ctx.ellipse(s * R * 1.12, 34, R * 0.34, R * 0.52, s * 0.16, 0, Math.PI * 2); ctx.fill();
      });
    } else if (hair === "ponytail") {
      ctx.beginPath(); ctx.ellipse(R * 1.06, 42, R * 0.26, R * 0.58, 0.24, 0, Math.PI * 2); ctx.fill();
    } else if (hair === "bun") {
      ctx.beginPath(); ctx.arc(0, -R * 1.06, R * 0.40, 0, Math.PI * 2); ctx.fill();
    } else if (hair === "messy") {
      ctx.beginPath(); ctx.ellipse(0, -R * 0.05, R * 1.15, R * 1.14, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // 耳朵
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(-R * 0.99, 10, R * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(R * 0.99, 10, R * 0.13, 0, Math.PI * 2); ctx.fill();

    // 脸
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.fillStyle = skin; ctx.fill();

    // 前发：顶部圆顶 + 分型发梢
    ctx.fillStyle = hc;
    ctx.beginPath();
    ctx.moveTo(-R * 1.0, -R * 0.10);
    ctx.bezierCurveTo(-R * 1.09, top, R * 1.09, top, R * 1.0, -R * 0.10);
    if (hair === "short") {
      ctx.lineTo(R * 0.72, -R * 0.34);
      ctx.lineTo(R * 0.50, -R * 0.12);
      ctx.lineTo(R * 0.20, -R * 0.38);
      ctx.lineTo(-R * 0.10, -R * 0.14);
      ctx.lineTo(-R * 0.44, -R * 0.38);
      ctx.lineTo(-R * 0.70, -R * 0.16);
    } else if (hair === "messy") {
      ctx.lineTo(R * 0.80, -R * 0.36);
      ctx.lineTo(R * 0.58, -R * 0.10);
      ctx.lineTo(R * 0.30, -R * 0.42);
      ctx.lineTo(R * 0.02, -R * 0.16);
      ctx.lineTo(-R * 0.26, -R * 0.44);
      ctx.lineTo(-R * 0.54, -R * 0.14);
      ctx.lineTo(-R * 0.80, -R * 0.34);
    } else if (hair === "twin" || hair === "bun" || hair === "ponytail") {
      ctx.lineTo(R * 0.66, -R * 0.30);
      ctx.quadraticCurveTo(R * 0.34, -R * 0.04, R * 0.10, -R * 0.30);
      ctx.quadraticCurveTo(-R * 0.18, -R * 0.02, -R * 0.52, -R * 0.32);
    } else { // bob
      ctx.lineTo(R * 0.66, -R * 0.44);
      ctx.quadraticCurveTo(R * 0.32, -R * 0.12, R * 0.06, -R * 0.32);
      ctx.quadraticCurveTo(-R * 0.24, -R * 0.10, -R * 0.60, -R * 0.40);
    }
    ctx.closePath();
    ctx.fill();
    ctx.save();
    ctx.globalAlpha = 0.32;
    ctx.strokeStyle = mix(hc, "#000000", 0.40);
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = R * 0.05;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(R * 0.06, -R * 0.18, R * 0.78, Math.PI * 1.16, Math.PI * 1.42);
    ctx.stroke();
    ctx.restore();

    // 鬓发
    if (hair === "bob" || hair === "ponytail" || hair === "twin") {
      ctx.fillStyle = hc;
      [-1, 1].forEach(function (s) {
        ctx.beginPath();
        ctx.moveTo(s * R * 0.99, -R * 0.22);
        ctx.quadraticCurveTo(s * R * 1.11, R * 0.12, s * R * 1.00, R * 0.40);
        ctx.quadraticCurveTo(s * R * 0.88, R * 0.16, s * R * 0.86, -R * 0.14);
        ctx.closePath(); ctx.fill();
      });
    }

    // 眉毛
    ctx.strokeStyle = line; ctx.lineWidth = 6.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-R * 0.53, -R * 0.35); ctx.quadraticCurveTo(-R * 0.40, -R * 0.43, -R * 0.25, -R * 0.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(R * 0.25, -R * 0.35); ctx.quadraticCurveTo(R * 0.40, -R * 0.43, R * 0.53, -R * 0.35); ctx.stroke();

    // 眼睛
    var ex = R * 0.39, ey = R * 0.10;
    var dark = "#2B2430";
    if (expr === "gentle") {
      ctx.strokeStyle = dark; ctx.lineWidth = 8;
      [-1, 1].forEach(function (s) {
        ctx.beginPath();
        ctx.arc(s * ex, ey + 6, R * 0.16, Math.PI * 1.12, Math.PI * 1.88);
        ctx.stroke();
      });
    } else if (expr === "sleepy") {
      [-1, 1].forEach(function (s) {
        ctx.beginPath();
        ctx.ellipse(s * ex, ey + 2, R * 0.16, R * 0.15, 0, 0, Math.PI);
        ctx.fillStyle = dark; ctx.fill();
        ctx.strokeStyle = dark; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(s * ex - R * 0.17, ey - 3); ctx.lineTo(s * ex + R * 0.17, ey - 3); ctx.stroke();
      });
    } else {
      var ry = expr === "cool" ? R * 0.12 : R * 0.195;
      [-1, 1].forEach(function (s) {
        ctx.beginPath(); ctx.ellipse(s * ex, ey, R * 0.145, ry, 0, 0, Math.PI * 2);
        ctx.fillStyle = dark; ctx.fill();
        if (expr === "energetic") {
          star(s * ex + R * 0.04, ey - R * 0.06, R * 0.08, "#FFFFFF");
          star(s * ex - R * 0.05, ey + R * 0.07, R * 0.038, "#FFFFFF");
        } else {
          ctx.beginPath(); ctx.arc(s * ex + R * 0.045, ey - R * 0.07, R * 0.055, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,255,255,0.92)"; ctx.fill();
          ctx.beginPath(); ctx.arc(s * ex - R * 0.05, ey + R * 0.06, R * 0.026, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.fill();
        }
      });
      if (expr === "cool") {
        ctx.strokeStyle = line; ctx.lineWidth = 5;
        [-1, 1].forEach(function (s) {
          ctx.beginPath();
          ctx.moveTo(s * ex - R * 0.16, ey - R * 0.11);
          ctx.lineTo(s * ex + R * 0.16, ey - R * 0.14);
          ctx.stroke();
        });
      }
    }

    // 腮红
    ctx.fillStyle = "rgba(240,116,116,0.28)";
    ctx.beginPath(); ctx.ellipse(-R * 0.68, R * 0.44, R * 0.18, R * 0.11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(R * 0.68, R * 0.44, R * 0.18, R * 0.11, 0, 0, Math.PI * 2); ctx.fill();

    // 嘴
    ctx.strokeStyle = "#8C3B34"; ctx.lineWidth = 6; ctx.lineCap = "round";
    if (expr === "energetic") {
      ctx.beginPath(); ctx.ellipse(0, R * 0.52, R * 0.14, R * 0.13, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#B4504A"; ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, R * 0.57, R * 0.07, R * 0.05, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#F09A93"; ctx.fill();
    } else if (expr === "cool") {
      ctx.beginPath(); ctx.moveTo(-R * 0.10, R * 0.52); ctx.lineTo(R * 0.12, R * 0.49); ctx.stroke();
    } else if (expr === "sleepy") {
      ctx.beginPath(); ctx.moveTo(-R * 0.09, R * 0.50); ctx.quadraticCurveTo(0, R * 0.58, R * 0.09, R * 0.50); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(0, R * 0.42, R * 0.14, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke();
    }

    // 配饰
    if (acc === "headset") {
      ctx.strokeStyle = mix(t.accent, "#000000", 0.05); ctx.lineWidth = 12;
      ctx.beginPath(); ctx.arc(0, 0, R * 1.16, Math.PI * 1.10, Math.PI * 1.90); ctx.stroke();
      [-1, 1].forEach(function (s) {
        fillR(s * R * 1.14 - R * 0.16, -R * 0.08, R * 0.32, R * 0.40, R * 0.13, t.accent);
        fillR(s * R * 1.14 - R * 0.085, R * 0.04, R * 0.17, R * 0.17, R * 0.085, mix(t.accent2, "#000000", 0.1));
      });
    } else if (acc === "glasses") {
      ctx.strokeStyle = "#3A3444"; ctx.lineWidth = 6;
      [-1, 1].forEach(function (s) {
        ctx.beginPath(); ctx.arc(s * ex, ey, R * 0.245, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.12)";
        ctx.beginPath(); ctx.arc(s * ex, ey, R * 0.245, 0, Math.PI * 2); ctx.fill();
      });
      ctx.beginPath(); ctx.moveTo(-R * 0.145, ey - 2); ctx.lineTo(R * 0.145, ey - 2); ctx.stroke();
    } else if (acc === "cap") {
      ctx.fillStyle = t.accent;
      ctx.beginPath(); ctx.arc(0, -R * 0.06, R * 1.06, Math.PI * 1.04, Math.PI * 1.96); ctx.fill();
      ctx.beginPath(); ctx.ellipse(R * 0.10, -R * 0.30, R * 1.02, R * 0.20, 0.04, 0, Math.PI); ctx.fill();
      ctx.fillStyle = rgba("#ffffff", 0.40);
      ctx.beginPath(); ctx.arc(0, -R * 0.08, R * 0.17, 0, Math.PI * 2); ctx.fill();
    } else if (acc === "ribbon") {
      var bx = -R * 0.74, by = -R * 0.92;
      ctx.fillStyle = t.accent2;
      ctx.beginPath();
      ctx.moveTo(bx, by); ctx.lineTo(bx - R * 0.30, by - R * 0.16);
      ctx.lineTo(bx - R * 0.26, by + R * 0.18); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(bx, by); ctx.lineTo(bx + R * 0.30, by - R * 0.16);
      ctx.lineTo(bx + R * 0.26, by + R * 0.18); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(bx, by, R * 0.10, 0, Math.PI * 2); ctx.fillStyle = t.accent; ctx.fill();
    }
  }

  function drawProp(kind, x, y, s, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    if (kind === "burger") {
      ctx.fillStyle = "#E8A33D";
      ctx.beginPath(); ctx.ellipse(0, 26, 46, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#8B4A2B";
      rrect(-46, 6, 92, 18, 7); ctx.fill();
      ctx.fillStyle = "#5FA855";
      ctx.beginPath();
      ctx.moveTo(-48, 4);
      for (var i = 0; i < 6; i++) {
        ctx.quadraticCurveTo(-48 + i * 16 + 8, i % 2 ? -2 : 8, -48 + (i + 1) * 16, 4);
      }
      ctx.lineTo(48, 8); ctx.lineTo(-48, 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#F0B860";
      ctx.beginPath(); ctx.ellipse(0, -18, 48, 30, 0, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#FFF0CF";
      [[-22, -26], [-4, -34], [16, -26], [30, -18], [-30, -14], [6, -14]].forEach(function (p) {
        ctx.beginPath(); ctx.ellipse(p[0], p[1], 4.4, 2.8, 0.3, 0, Math.PI * 2); ctx.fill();
      });
    } else if (kind === "fries") {
      ctx.fillStyle = "#E9BE4A";
      [-26, -14, 0, 13, 26].forEach(function (dx, i) {
        rrect(dx - 6, -52 + (i % 2) * 6, 12, 46, 4); ctx.fill();
      });
      ctx.fillStyle = "#D0342C";
      ctx.beginPath();
      ctx.moveTo(-34, -14); ctx.lineTo(34, -14);
      ctx.lineTo(26, 40); ctx.lineTo(-26, 40); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#FFC72C";

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    if (portraitImg && portraitImg.naturalWidth) {

      var w = portraitImg.naturalWidth * s, h = portraitImg.naturalHeight * s;
      ctx.fillStyle = "#FDF1DC";
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

    var peak = 0;

      switch (b.kind) {
        case "attrs": next = blockAttrs(b, y, t); break;
        case "metrics": next = blockMetrics(b, y, t); break;
        case "list": next = blockList(b, y, t); break;
        case "facts": next = blockFacts(b, y, t); break;
        case "hour24": next = blockHour24(b, y, t); break;
        case "week": next = blockWeek(b, y, t); break;
        case "gauge": next = blockGauge(b, y, t); break;
        case "badges": next = blockBadges(b, y, t); break;
        case "progress": next = blockProgress(b, y, t); break;
        case "tags": next = blockTags(b, y, t); break;
        case "note": next = blockNote(b, y, t); break;
        case "quote": next = blockQuote(b, y, t); break;
        default: next = y;
      }
      y = next + 30;
    });
    return y;
  }

  /* ------------------------------------------------------------------ 主绘制 */

  function renderCard() {
    var t = theme(), rar = rarity(), p = persona(), card = cardByName(state.card);

    // 首次渲染触发立绘加载，onload 后再重绘一次（失败则一直用程序化角色）
    portraitReady();

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.scale(DPR, DPR);

    canvas.setAttribute("aria-label", "麦麦角色卡：" + p.name + " · " + p.title + " · " + rar.name);

    paintBackground(t, rar);
    paintSurface(t, rar);
    drawHeader(t, rar, card);
    drawFooter(t, card);

    var bodyY;
    if (card.type === "id") {
      var pR = 232, pCx = W / 2, pCy = 434;

      // 品质环境光
      var halo = ctx.createRadialGradient(pCx, pCy, pR * 0.5, pCx, pCy, pR * 1.72);
      halo.addColorStop(0, rgba(rar.glow, 0.34));
      halo.addColorStop(0.66, rgba(rar.color, 0.13));
      halo.addColorStop(1, rgba(rar.color, 0));
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(pCx, pCy, pR * 1.72, 0, Math.PI * 2); ctx.fill();

      // 外圈光边
      ctx.save();
      ctx.shadowColor = rgba(rar.color, 0.8);
      ctx.shadowBlur = 32 + rar.stars * 8;
      ctx.strokeStyle = rgba(rar.glow, 0.9);
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(pCx, pCy, pR + 8, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();

      // 立绘（无素材时自动退回程序化角色）
      drawPortraitCircle(pCx, pCy, pR, 1.25, -0.01, p.look, t);

      // 内缘压暗，让圆窗有厚度
      var vg = ctx.createRadialGradient(pCx, pCy, pR * 0.70, pCx, pCy, pR);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0,0.16)");
      ctx.save();
      ctx.beginPath(); ctx.arc(pCx, pCy, pR, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = vg; ctx.fillRect(pCx - pR, pCy - pR, pR * 2, pR * 2);
      ctx.restore();

      // 双环
      ctx.strokeStyle = rgba(rar.color, 0.85); ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(pCx, pCy, pR + 17, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = rgba(t.ink, 0.10); ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(pCx, pCy, pR + 2, 0, Math.PI * 2); ctx.stroke();

      // 战力徽章（压在光环右下）
      var bx = pCx + pR * 0.70, by = pCy + pR * 0.70;
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.28)"; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
      ctx.beginPath(); ctx.arc(bx, by, 46, 0, Math.PI * 2);
      ctx.fillStyle = t.surface; ctx.fill();
      ctx.restore();
      ctx.beginPath(); ctx.arc(bx, by, 46, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(rar.color, 0.9); ctx.lineWidth = 3; ctx.stroke();
      txt(String(Math.round(p.power)), bx, by + 2, 30, rar.color, 800, "center", FN);
      txt("战力", bx, by + 26, 12, t.ink3, 600, "center");

      // 名字
      txt(p.name, W / 2, 756, 64, t.ink, 800, "center");

      // 称号 chip
      var ttl = p.title, tw = measure(ttl, 22, 700) + 78;
      var tx = W / 2 - tw / 2;
      fillR(tx, 778, tw, 44, 22, rgba(rar.color, 0.16));
      strokeR(tx, 778, tw, 44, 22, rgba(rar.color, 0.55), 1.4);
      txt(p.element, tx + 28, 808, 20, rar.color, 800, "left");
      txt(ttl, tx + 56, 809, 22, t.ink, 700);

      // slogan
      spaced(p.slogan, W / 2, 854, 15, t.ink3, 600, 3.2, "center");

      bodyY = 886;
    } else {
      // 紧凑身份条
      drawPortraitCircle(IN + 60, 292, 58, 1.85, -0.03, p.look, t);
      txt(p.name, IN + 140, 280, 40, t.ink, 800);
      txt(p.title + " · " + p.element + "属性", IN + 140, 318, 21, t.ink2, 500);
      txt(card.subtitle || "", IN + 140, 348, 17, t.ink3, 400);

      // 右侧战力
      txt("战力", W - IN - 120, 270, 16, t.ink3, 600, "right");
      txt(String(Math.round(p.power)), W - IN, 300, 46, rar.color, 800, "right", FN);

      ctx.strokeStyle = t.line; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(IN, 372); ctx.lineTo(W - IN, 372); ctx.stroke();

      bodyY = BODY_TOP;
    }

    var endY = renderBlocks(card.blocks || [], bodyY, t);

    // 溢出保护：内容过高时在控制台给出提示（仅开发期可见）
    if (endY > H - PAD - 104) {
      console.warn("卡面内容溢出：" + card.type + " 结束于 " + Math.round(endY));
    }
  }

  /* ------------------------------------------------------------------ 导出 */

  function fileName() {
    var p = persona(), r = rarity();
    return "mcd-card-" + state.card + "-" + r.key + "-" + (p.cardNo || "demo") + ".png";
  }

  function download() {
    canvas.toBlob(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = fileName();
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      flash("已保存 ✓");
    }, "image/png");
  }

  function copyImage() {
    if (!navigator.clipboard || !window.ClipboardItem) { flash("请用「保存图片」"); return; }
    canvas.toBlob(function (blob) {
      navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(
        function () { flash("已复制 ✓"); },
        function () { flash("请用「保存图片」"); }
      );
    }, "image/png");
  }

  var flashTimer = null;
  function flash(msg) {
    var btn = document.getElementById("btnSave");
    var old = btn.textContent;
    btn.textContent = msg;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { btn.textContent = old; }, 1800);
  }

  /* ------------------------------------------------------------------ 界面装配 */

  function buildUI() {
    var p = persona();
    document.getElementById("metaLine").textContent =
      (DATA.meta.mode === "sample" ? "演示数据" : DATA.meta.mode === "live" ? "实时数据" : "离线数据") +
      " · " + (p.name || "") + " · " + (p.title || "") +
      " · " + (p.rarity ? p.rarity.name : "");

    var tabs = document.getElementById("tabs");
    DATA.cards.forEach(function (c) {
      var b = document.createElement("button");
      b.className = "tab" + (c.type === state.card ? " on" : "");
      b.dataset.type = c.type;
      b.innerHTML = '<span class="n">' + c.name + '</span><span class="e">' + c.en + '</span>';
      b.onclick = function () { state.card = c.type; syncUI(); };
      tabs.appendChild(b);
    });

    var sw = document.getElementById("swatches");
    DATA.themes.forEach(function (th) {
      var b = document.createElement("button");
      b.className = "sw" + (th.key === theme().key ? " on" : "");
      b.dataset.key = th.key;
      b.innerHTML = '<i style="background:linear-gradient(135deg,' + th.bg1 + ',' + th.surface + ' 55%,' + th.accent + ')"></i>' + th.name;
      b.onclick = function () { state.theme = th.key; syncUI(); };
      sw.appendChild(b);
    });

    var sel = document.getElementById("rarityPick");
    var auto = document.createElement("option");
    auto.value = "auto"; auto.textContent = "自动（按战力 " + Math.round(p.power) + "）";
    sel.appendChild(auto);
    (DATA.ladder || []).forEach(function (tier) {
      var o = document.createElement("option");
      o.value = tier.key; o.textContent = tier.name + " · " + tier.tier;
      sel.appendChild(o);
    });
    sel.onchange = function () {
      state.rarity = sel.value;
      document.getElementById("previewTag").hidden = state.rarity === "auto";
      syncUI();
    };

    var lg = document.getElementById("legend");
    (DATA.ladder || []).forEach(function (tier) {
      var d = document.createElement("div");
      d.innerHTML = '<i style="background:' + tier.color + ';color:' + tier.color + '"></i>' +
        '<span>' + tier.name + ' · ' + tier.tier + '</span>' +
        '<span style="margin-left:auto;color:#8a8a92;font-size:11px">战力 ≥ ' + tier.min + '</span>';
      lg.appendChild(d);
    });

    document.getElementById("dataNote").textContent =
      "卡号 " + (p.cardNo || "—") + " · 画像命中「" + (p.title || "—") + "」：" + (p.archetypeReason || "") +
      " · 主题随画像自动匹配，可手动覆盖。";

    document.getElementById("btnSave").onclick = download;
    document.getElementById("btnCopy").onclick = copyImage;
    document.getElementById("btnLoad").onclick = function () { document.getElementById("fileInput").click(); };
    document.getElementById("fileInput").onchange = function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          DATA = JSON.parse(reader.result);
          state.card = DATA.defaultCard || "id";
          state.theme = null;
          state.rarity = "auto";
          document.getElementById("tabs").innerHTML = "";
          document.getElementById("swatches").innerHTML = "";
          document.getElementById("legend").innerHTML = "";
          document.getElementById("rarityPick").innerHTML = "";
          buildUI(); syncUI();
        } catch (err) { alert("card.json 解析失败：" + err.message); }
      };
      reader.readAsText(f);
    };

    document.addEventListener("keydown", function (e) {
      var types = DATA.cards.map(function (c) { return c.type; });
      var i = types.indexOf(state.card);
      if (e.key === "ArrowRight") state.card = types[(i + 1) % types.length];
      else if (e.key === "ArrowLeft") state.card = types[(i - 1 + types.length) % types.length];
      else return;
      syncUI();
    });

    // 拖拽载入
    document.addEventListener("dragover", function (e) { e.preventDefault(); });
    document.addEventListener("drop", function (e) {
      e.preventDefault();
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) document.getElementById("fileInput").onchange({ target: { files: [f] } });
    });
  }

  function syncUI() {
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.classList.toggle("on", b.dataset.type === state.card);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".sw"), function (b) {
      b.classList.toggle("on", b.dataset.key === theme().key);
    });
    renderCard();
  }

  /* 启动 */
  if (!DATA) {
    document.getElementById("metaLine").textContent = "未加载数据";
    txt("请先运行 python scripts/render.py 打包", W / 2, H / 2, 26, "#8a8a92", 500, "center");
  } else {
    // 深链参数：?card=stats&theme=midnight&rarity=gold&bare=1
    try {
      var qs = new URLSearchParams(location.search);
      if (qs.get("card")) state.card = qs.get("card");
      if (qs.get("theme")) state.theme = qs.get("theme");
      if (qs.get("rarity")) {
        state.rarity = qs.get("rarity");
        if (state.rarity !== "auto") document.getElementById("previewTag").hidden = false;
      }
      if (qs.has("bare")) document.body.classList.add("bare");
    } catch (e) { /* 老浏览器忽略 */ }

    if (!state.card || !DATA.cards.some(function (c) { return c.type === state.card; })) {
      state.card = DATA.defaultCard || "id";
    }
    buildUI();
    renderCard();
  }
})();
</script>
</body>
</html>
